# Настройки серверного паркур-плагина.
# Единицы скорости и дистанций — блоки/тик, как во внутренней физике Minecraft
# (это ровно те же величины, что были в ParkourConfig.java исходного мода,
# поэтому дальность рывка/прыжка от стены и т.д. останутся такими же "на ощупь").

wallContactDistance: 0.06

wallJump:
  speed: 0.44      # горизонтальная скорость отскока от стены (фиксация)
  vertical: 0.46   # вертикальный импульс отскока

cling:
  slideSpeed: 0.04 # скорость сползания при фиксации на стене

wallRun:
  minSpeed: 0.30      # минимальная скорость подлёта, чтобы начался бег по стене
  maxTicks: 100        # максимальная длительность бега по стене
  speedFactor: 0.75     # множитель скорости бега по стене относительно скорости подлёта
  verticalSpeed: 0.10   # насколько быстро можно подниматься/опускаться взглядом

ledge:
  maxHeight: 1.25  # максимальная высота уступа, на который можно забраться

burst:
  seconds: 4.0            # длительность разбега
  cooldownSeconds: 3.0    # перезарядка разбега
  multiplier: 2.0         # во сколько раз ускоряемся на пике разбега

dash:
  barSeconds: 1.2       # за сколько секунд шкала рывка проходит 1 деление (зелёная/жёлтая/красная зона)
  cooldownSeconds: 1.0
  distance1: 3.0
  distance2: 5.0
  distance3: 7.0

slide:
  distance: 5.0
  cooldownSeconds: 1.0
